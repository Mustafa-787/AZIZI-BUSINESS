<script>

/* ===================================================================
   AZIZI Business — CORE (pure logic, no DOM)
   Money = integer minor units. Rates = decimal strings (BigInt math).
   =================================================================== */
'use strict';
var AF = (function () {
  const APP = { name: 'AZIZI Business', version: '1.1.0', schemaVersion: 1, format: 'azizi-finance' };
  const ACCOUNT_TYPES = ['bank', 'cash', 'brokerage', 'investment', 'custom'];
  const TX_TYPES = ['income', 'expense', 'transfer_internal', 'transfer_external', 'debt_payment', 'receivable_collection', 'adjustment'];
  const CONTACT_TYPES = ['individual', 'company', 'bank', 'insurance', 'brokerage', 'other'];
  const DEBT_KINDS = ['payable', 'receivable'];
  const DOC_KINDS = ['invoice', 'receipt'];
  const COLLS = ['accounts', 'contacts', 'transactions', 'debts', 'documents', 'rates'];

  const pad = (n, l) => String(n).padStart(l || 2, '0');
  const div = (a, b) => Math.trunc(a / b);
  const mod = (a, b) => a - Math.trunc(a / b) * b;
  const nowIso = () => new Date().toISOString();

  function uid(prefix) {
    const a = new Uint8Array(9);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
    else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    let s = ''; for (const b of a) s += pad(b.toString(16));
    return prefix + '_' + s;
  }
  function allIds(db) { const s = new Set(); for (const k of COLLS) for (const r of (db[k] || [])) if (r) s.add(r.id); return s; }
  function newId(db, prefix) { const used = allIds(db); let id; do { id = uid(prefix); } while (used.has(id)); return id; }

  /* ---------------- digits & decimals ---------------- */
  const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹', AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  function normalizeDigits(s) {
    return String(s == null ? '' : s)
      .replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
      .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d))

const CHART_COLORS = ['var(--c1)', 'var(--c4)', 'var(--c6)', 'var(--c3)', 'var(--c5)', 'var(--c2)', 'var(--c7)'];
function barChart(series, cur) {
  const W = 560, H = 230, pl = 8, pb = 26, pt = 14, n = series.length; if (!n) return '';
  const max = Math.max(1, ...series.map(s => Math.max(s.income, s.expense))); const ch = H - pb - pt, bw = (W - pl * 2) / n;

  series.forEach((s, i) => {

  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('dash.monthly')) + '">' + g + '</svg><div class="legend"><span><i style="background:var(--pos)"></i>' + esc(t('flow.income')) + '</span><span><i style="background:var(--c1)"></i>' + esc(t('flow.expense')) + '</span></div>';

function donutChart(cats, cur) {

function setupPwa() {
  try {
    const icon = BRAND.icon; const base = location.href.split('#')[0];
    const mf = { name: 'AZIZI Business', short_name: 'AZIZI', description: 'Personal accounting — BUILD. MANAGE. GROW.', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#000000', theme_color: '#000000', icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' })); document.head.appendChild(l);
    const a = document.createElement('link'); a.rel = 'icon'; a.type = 'image/png'; a.href = icon; document.head.appendChild(a);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = icon; document.head.appendChild(ap);
  } catch (e) { }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js?page=' + encodeURIComponent(location.pathname)).catch(() => { });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
}
async function recoveryFlow(raw, errors, snaps) {
  STATE.db = emptyDb({ language: STATE.prefLang }); render();
  const lines = summarizeErrors(errors || []); const latest = snaps && snaps[0];
  openModal(t('recover.title'), '<div class="form-err"><ul>' + lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul></div><div class="note">' + esc(t('recover.text')) + '</div>', { footer: false });
  $('#modal .mbd').insertAdjacentHTML('beforeend', '<div class="row"><button type="button" class="btn pri" id="rc-repair">' + esc(t('import.repair')) + '</button>' + (latest ? '<button type="button" class="btn" id="rc-snap">' + esc(t('recover.useSnapshot', { date: new Date(latest.at).toLocaleString() })) + '</button>' : '') + '<button type="button" class="btn" id="rc-dl">' + esc(t('recover.downloadRaw')) + '</button><button type="button" class="btn dng" id="rc-empty">' + esc(t('recover.startEmpty')) + '</button></div>');
  $('#rc-dl').onclick = () => downloadText('azizi-business-damaged-copy.json', JSON.stringify(raw, null, 2));
  $('#rc-repair').onclick = async () => { const r = repairDb(raw); if (r && !validateDb(r.db).errors.length) { await closeModal(true); STATE.db = r.db; await persistNow(); render(); toast(t('import.done')); } else toast(t('import.repairFailed'), true); };
  if (latest) $('#rc-snap').onclick = async () => { const r = parseDbText(latest.json); if (r.ok) { await closeModal(true); STATE.db = r.db; await persistNow(); render(); toast(t('import.done')); } else toast(t('import.repairFailed'), true); };
  $('#rc-empty').onclick = async () => { await KV.set('db-damaged', raw); await closeModal(true); STATE.db = emptyDb({ language: STATE.prefLang }); await persistNow(); render(); };
}
async function boot() {
  try { const p = JSON.parse(localStorage.getItem('azizi-appearance') || '{}'); STATE.prefLang = p.language === 'en' ? 'en' : (p.language === 'fa' ? 'fa' : (((navigator.language || '') + '').indexOf('en') === 0 ? 'en' : 'fa')); } catch (e) { }
  STATE.file.supported = FS.supported(); setupPwa();
  let stored; try { stored = await KV.get('db'); } catch (e) { stored = undefined; }
  if (stored) {
    const m = (() => { try { return AF.migrate(JSON.parse(JSON.stringify(stored))); } catch (e) { return stored; } })(); const v = validateDb(m);
    if (v.errors.length) { const snaps = (await KV.get('snapshots')) || []; await recoveryFlow(stored, v.errors, snaps); return; }
    m.settings = normalizeSettings(m.settings); if (!Array.isArray(m.audit)) m.audit = []; STATE.db = m;
  } else { const s = { language: STATE.prefLang }; Object.assign(s, languageDefaults(STATE.prefLang)); STATE.db = emptyDb(s); }
  try { const h = await KV.get('fileHandle'), meta = await KV.get('fileMeta'); if (h && meta && meta.name) { Object.assign(STATE.file, { handle: h, name: meta.name, lastModified: meta.lastModified || 0, state: meta.dirty ? 'dirty' : 'clean' }); } } catch (e) { }
  STATE.snapshots = (await KV.get('snapshots')) || [];
  savePrefs(); render(); if (!stored) persistNow();
}
try { if (location.hash === '' || location.hash === '#') location.hash = '#/dashboard'; } catch (e) { }
boot().catch(function (e) {

});
